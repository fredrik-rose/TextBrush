[workspace]
name = "textbrush"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]


[system-requirements]
cuda = "13"


[dependencies]
python = ">=3.11,<3.13"

matplotlib = "*"
numpy = "*"
pytorch-gpu = "*"
torchvision = "*"

cuda-version = "13.2.*"

black = "*"
flake8 = "*"
mypy = "*"
pylint = "*"
ruff = "*"
cuda-nvcc = ">=13.2.78,<14"
gradio = ">=6.18.0,<7"


[pypi-dependencies]
torchinfo = "*"
torchview = "*"


[tasks]
tb = "python main.py"
lint = "make lint"
